<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D models · Abandoned but Not Forgotten</title>
<meta name="description" content="Walk a timeline of the machines left on the Moon and Mars, step up to any of them, take it apart, and find out what every part did.">
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html, body { height: 100%; overflow: hidden; }
body { max-width: none; padding: 0; }
/* The room takes the colour of the world you are standing in */
.tint { position: fixed; inset: 0; pointer-events: none; transition: opacity 1.4s; opacity: 0; }
.tint.mars { background: radial-gradient(ellipse 100% 55% at 50% 0%, rgb(190 92 44 / .3), transparent 70%); }
.tint.moon { background: radial-gradient(ellipse 100% 55% at 50% 0%, rgb(150 165 200 / .16), transparent 70%); }
body[data-world="mars"] .tint.mars, body[data-world="moon"] .tint.moon { opacity: 1; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline-offset: -4px; }
#view:active { cursor: grabbing; }
.ui { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 0 16px 12px; pointer-events: none; }
.ui a, .ui button, .ui .panel { pointer-events: auto; }

/* Index of the line: two rows, a dot per machine */
.picker .row { position: relative; display: flex; align-items: center; gap: 0 1.4rem; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.picker .row::-webkit-scrollbar { display: none; }
.picker .world { flex: none; width: 3.6rem; color: var(--ink); position: sticky; left: 0; z-index: 1; background: var(--bg); align-self: stretch; display: flex; align-items: center; }
.picker button { flex: none; padding: 0 0 0 14px; position: relative; }
.picker button::before { content: ""; position: absolute; left: 0; top: 50%; width: 7px; height: 7px; margin-top: -4px; border-radius: 50%; border: 1px solid var(--dim); }
.picker button small { color: var(--sig); opacity: .8; }
.picker button[aria-pressed="true"] { color: var(--sig); }
.picker button[aria-pressed="true"]::before { background: var(--sig); border-color: var(--sig); box-shadow: 0 0 0 4px rgb(255 184 77 / .2); }

.panel { margin-top: auto; max-height: 46vh; overflow-y: auto; padding-top: 2.5rem; margin-inline: -16px; padding-inline: 16px; background: linear-gradient(transparent, rgb(8 9 10 / .88) 2.5rem); }
.panel h1 { font: 300 clamp(1.9rem, 5vw, 3.4rem)/1 var(--serif); letter-spacing: -.03em; margin: .2rem 0 .4rem; }
.facts { margin: 0 0 .8rem; text-transform: none; letter-spacing: .02em; }
#detail { min-height: 3.2em; max-width: 30em; }
#detail h2 { font: 400 1.3rem/1.2 var(--serif); color: var(--sig); margin: 0 0 .3rem; }
#detail p { margin: 0; font-size: 1.05rem; line-height: 1.45; }
.acts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
.acts button, .acts a { border: 1px solid var(--rule); padding: 0 .9rem; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; background: rgb(8 9 10 / .6); }
.acts .main { border-color: var(--sig); color: var(--sig); }
.acts [aria-pressed="true"] { background: var(--sig); border-color: var(--sig); color: #1a1205; }
body:not(.inspect) .in, body.inspect .out { display: none; } /* .out: only while walking the line · .in: only while inspecting */
.parts { list-style: none; display: flex; flex-wrap: wrap; gap: 0 1rem; margin: .6rem 0 0; padding: 0; }
.parts button { padding: 0; font: 300 .95rem/1 var(--serif); color: var(--dim); text-decoration: underline; text-underline-offset: .25em; text-decoration-color: var(--rule); }
.parts button[aria-pressed="true"] { color: var(--sig); }

#pins { position: fixed; inset: 0; pointer-events: none; display: none; }
.pin { position: absolute; left: 0; top: 0; min-height: 0; padding: .28rem .55rem .28rem 1.1rem; white-space: nowrap; font: 400 .6875rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: rgb(8 9 10 / .72); border: 1px solid rgb(255 255 255 / .16); will-change: transform; transition: opacity .3s, background .2s; }
.pin::before { content: ""; position: absolute; left: .4rem; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--sig); }
.pin:hover, .pin.on { background: var(--sig); color: #1a1205; border-color: var(--sig); }
.pin:hover::before, .pin.on::before { background: #1a1205; }
.nav { position: fixed; top: 46%; width: 48px; height: 72px; margin-top: -36px; font-size: 2rem; color: var(--dim); }
.nav:hover { color: var(--sig); }
#prevM { left: 2px; } #nextM { right: 2px; }
#tip { position: fixed; left: 0; top: 0; margin: 0; padding: .3rem .6rem; background: rgb(8 9 10 / .85); color: var(--sig); pointer-events: none; opacity: 0; white-space: nowrap; }
#toast { position: fixed; left: 50%; top: 24%; transform: translateX(-50%); margin: 0; font: 300 clamp(1.3rem, 4vw, 2rem)/1.1 var(--serif); text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s; text-shadow: 0 2px 20px #000; }
#toast.on { opacity: 1; }
@media (min-width: 60rem) {
  .ui { padding: 0 48px 36px; }
  .picker .row { margin: 0; padding: 0; }
  .panel { max-width: 30rem; max-height: none; overflow: visible; background: none; margin-inline: 0; padding-inline: 0; }
  #pins { display: block; } .parts { display: none; }
}

/* ───────── Premium pass: glass card, bottom timeline, ghost year, vignette ───────── */
.vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgb(0 0 0 / .62)); }
/* The year behind the machine: solid, lit from above and fading into the horizon; kept right of the card and below the header. */
#ghost { position: fixed; right: 4vw; top: 8vh; margin: 0; padding: .12em .04em 0 0; pointer-events: none; white-space: nowrap; font: 300 clamp(8rem, 25vw, 23rem)/1 var(--serif); letter-spacing: .05em; font-variant-numeric: lining-nums tabular-nums; color: transparent; background: linear-gradient(180deg, rgb(255 236 200 / .26), rgb(255 255 255 / .07) 55%, rgb(255 255 255 / 0) 92%); -webkit-background-clip: text; background-clip: text; transition: opacity .5s, transform .9s var(--drift); }
body.inspect #ghost { opacity: .55; }
#ghost.flip { opacity: 0; transform: translateY(.1em); }
.top #count { color: var(--ink); letter-spacing: .14em; }
.top #count b { color: var(--sig); font-weight: 500; }

/* The card */
.panel { margin: auto 0 0; max-height: 52vh; overflow-y: auto; padding: 1.4rem 1.25rem 1.25rem; background: rgb(14 15 19 / .58); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); border: 1px solid rgb(255 255 255 / .09); border-top-color: rgb(255 255 255 / .16); box-shadow: 0 30px 90px rgb(0 0 0 / .55); }
.panel #kind { color: var(--sig); letter-spacing: .14em; font-size: .6875rem; margin: 0; }
.panel h1 { font-size: clamp(1.8rem, 4.2vw, 2.7rem); margin: .5rem 0 .9rem; }
ul.facts { list-style: none; margin: 0 0 1rem; padding: 0; border-top: 1px solid rgb(255 255 255 / .09); }
ul.facts li { padding: .45rem 0; border-bottom: 1px solid rgb(255 255 255 / .09); color: var(--ink); font-size: .75rem; }
#detail { min-height: 2.6em; }
#detail h2 { font-size: 1.25rem; }
#detail p { font-size: 1rem; color: #cfcbc2; }
.acts { gap: .5rem; margin-top: 1rem; }
.acts button, .acts a { border: 1px solid rgb(255 255 255 / .16); background: rgb(255 255 255 / .03); padding: 0 1.05rem; color: var(--ink); transition: background .25s, border-color .25s, color .25s, transform .25s var(--drift); }
.acts button:hover, .acts a:hover { background: rgb(255 255 255 / .09); border-color: rgb(255 255 255 / .32); color: #fff; transform: translateY(-1px); }
.acts .main { background: var(--sig); border-color: var(--sig); color: #1a1205; font-weight: 500; }
.acts .main:hover { background: #ffc66e; border-color: #ffc66e; color: #1a1205; }

/* The timeline, along the bottom edge */
.ui { padding-bottom: 86px; }
.picker { position: fixed; left: 0; right: 0; bottom: 0; height: 74px; display: flex; align-items: stretch; gap: 2.2rem; padding: 0 16px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; background: linear-gradient(transparent, rgb(8 9 10 / .9) 45%); }
.picker::-webkit-scrollbar { display: none; }
.picker .row { flex: none; overflow: visible; margin: 0; padding: 0; gap: 0; align-items: flex-end; }
.picker .world { position: static; width: auto; background: none; align-self: flex-end; padding: 0 1rem 21px 0; color: var(--dim); font-size: .625rem; letter-spacing: .2em; }
.picker button { width: 4.6rem; height: 74px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 9px; padding-bottom: 14px; border-top: 0; color: var(--dim); }
.picker button::before { position: static; margin: 0; order: 1; width: 7px; height: 7px; transition: transform .4s var(--drift), background .3s, box-shadow .3s; }
.picker button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 47px; height: 1px; background: rgb(255 255 255 / .14); } /* the line the dots sit on */
.picker button small { order: 2; font-size: .6875rem; letter-spacing: .08em; color: inherit; opacity: 1; }
.picker button span { position: absolute; bottom: 58px; left: 50%; transform: translate(-50%, 4px); white-space: nowrap; font-size: .625rem; letter-spacing: .1em; color: var(--ink); background: rgb(14 15 19 / .9); padding: .25rem .5rem; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
.picker button:hover span, .picker button:focus-visible span { opacity: 1; transform: translate(-50%, 0); }
.picker button:hover { color: var(--ink); }
.picker button[aria-pressed="true"] { color: var(--sig); }
.picker button[aria-pressed="true"]::before { transform: scale(1.5); }

.nav { top: 44%; width: 48px; height: 48px; margin-top: -24px; border-radius: 50%; border: 1px solid rgb(255 255 255 / .16); background: rgb(14 15 19 / .5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 1.3rem; line-height: 1; color: var(--ink); transition: background .25s, border-color .25s, transform .25s var(--drift); }
.nav:hover { background: var(--sig); border-color: var(--sig); color: #1a1205; transform: scale(1.06); }
#prevM { left: 12px; } #nextM { right: 12px; }
.pin { border-color: rgb(255 255 255 / .2); background: rgb(14 15 19 / .7); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: .34rem .7rem .34rem 1.25rem; }
@media (min-width: 60rem) {
  .ui { padding: 0 48px 104px; }
  .panel { max-width: 25rem; max-height: none; overflow: visible; margin: auto 0 0; padding: 1.6rem 1.6rem 1.5rem; background: rgb(14 15 19 / .58); }
  .picker { padding: 0 48px; justify-content: center; }
  #prevM { left: 24px; } #nextM { right: 24px; }
}
@media (prefers-reduced-motion: reduce) { #ghost, .acts button, .acts a, .nav, .picker button::before { transition: none; } }
#detail p.mono { font-size: .6875rem; color: var(--dim); }
.acts button, .acts a { font-size: .6875rem; padding: 0 .85rem; }
@media (max-width: 59.99rem) { ul.facts { display: none; } .panel { max-height: 40vh; padding: 1rem 1rem .9rem; } .panel h1 { margin: .35rem 0 .5rem; } .nav { top: 30%; } }
@media (min-width: 60rem) { #prevM { left: auto; right: 84px; } .nav { top: auto; bottom: 118px; margin: 0; } }
.tools [aria-pressed="true"] { color: var(--sig); }
</style>
</head>
<body data-world="moon">
<div class="stars" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="tint mars" aria-hidden="true"></div><div class="tint moon" aria-hidden="true"></div>
<p id="ghost" aria-hidden="true"></p>
<canvas id="view" tabindex="0" role="img" aria-label="A line of ten machines in 3D, in order of year. Left and right arrows walk the line, Enter steps up to a machine, Escape steps back."></canvas>
<div id="pins"></div>
<div class="vig" aria-hidden="true"></div>

<div class="ui">
  <header class="top">
    <p class="mono">Hardware bay &nbsp;·&nbsp; <span id="count"></span></p>
    <div class="tools">
      <button class="mono" id="true" aria-pressed="false">True size</button>
      <button class="mono" id="tour" aria-pressed="false">▶ Tour</button>
      <a class="mono" href="index.html">◂ Listening station</a>
      <a class="mono" href="film.html">▸ Watch the film</a>
    </div>
  </header>
  <nav class="picker" aria-label="Jump to a machine, by world and year"></nav>

  <main class="panel">
    <p class="mono" id="kind"></p>
    <h1 id="name"></h1>
    <ul class="facts mono" id="facts"></ul>
    <div id="detail" role="status"></div>
    <div class="acts out">
      <button class="mono main" id="enter">Step closer ▸</button>
      <a class="mono" id="story" href="index.html">Its story ▸</a>
    </div>
    <div class="acts in">
      <button class="mono" id="back">◂ Back to the line</button>
      <button class="mono main" id="apart">Take it apart</button>
      <button class="mono" id="size" aria-pressed="false">How big is it?</button>
      <button class="mono" id="game">Play: find the part</button>
    </div>
    <ul class="parts in" id="parts" aria-label="Parts"></ul>
  </main>
</div>
<button class="nav" id="prevM" aria-label="Earlier machine">‹</button>
<button class="nav" id="nextM" aria-label="Later machine">›</button>
<p class="mono" id="tip" aria-hidden="true"></p>
<p id="toast" aria-hidden="true"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="models.js"></script>
<script>
// The hardware bay: a walk-through timeline. Two states:
//   line     the camera slides along a row of machines (Moon wing, then Mars wing), oldest first
//   inspect  the camera orbits one machine; it can be taken apart, measured, and quizzed
const $ = s => document.querySelector(s), V3 = THREE.Vector3;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = $('#view');
let R;
try { R = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) {}

// How big each machine really is: ['y', metres tall] or ['w', metres wide]. Used for the child-for-scale.
const SIZE = { perseverance: ['y', 2.2], ingenuity: ['y', 0.49], opportunity: ['y', 1.5], insight: ['w', 6], 'lm-descent': ['y', 7], 'mars-polar-lander': ['w', 3.6], lrrr: ['w', 0.7], 's-ivb': ['y', 17.8] };
const CHILD = 1.4, GAP = 4.4, WING = 3.2; // metres (a ten-year-old) · spacing along the line · extra gap between the wings

const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(36, 1, 0.05, 200);
scene.fog = new THREE.Fog(0x08090a, 9, 24); // machines further down the line sink into the dark
scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1c24, 0.35));
const key = new THREE.DirectionalLight(0xfff4e6, 1.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0008; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 24 }); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.8); rim.position.set(-5, 2, -6); scene.add(rim);
if (R) { R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; scene.environment = ENV(R, '#5a6480', '#0b0c10'); }

const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; };
const dirt = (base, grains, craters) => canvasTex(512, 512, (g, w) => {
  g.fillStyle = base; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 9000; i++) { g.fillStyle = grains[i % grains.length]; g.fillRect(Math.random() * w, Math.random() * w, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  for (let i = 0; i < craters; i++) { const r = 4 + Math.random() * 22, x = Math.random() * w, y = Math.random() * w, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(0.7, 'rgba(0,0,0,.3)'); gr.addColorStop(0.86, 'rgba(255,255,255,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
});
const SOIL = { Moon: dirt('#8f8d87', ['#a3a19a', '#7d7b76', '#b0aea6'], 26), Mars: dirt('#8a5236', ['#9a6040', '#7a452c', '#4a2c20'], 5) };
const edge = canvasTex(256, 256, g => { const r = g.createRadialGradient(128, 128, 30, 128, 128, 128); r.addColorStop(0, '#fff'); r.addColorStop(0.45, '#fff'); r.addColorStop(1, '#000'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
const label = (text, w, h, font, color) => canvasTex(w, h, g => { g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2); });
const flat = (geo, m, x, y, z) => { const p = new THREE.Mesh(geo, m); p.rotation.x = -Math.PI / 2; p.position.set(x, y, z); scene.add(p); return p; };
const childTex = canvasTex(128, 256, g => {
  g.fillStyle = '#ffb84d'; g.strokeStyle = '#ffb84d'; g.lineCap = 'round'; g.lineWidth = 20;
  g.beginPath(); g.arc(64, 34, 26, 0, 7); g.fill(); g.fillRect(40, 66, 48, 92);
  for (const [a, b, c, d] of [[44, 78, 22, 140], [84, 78, 106, 140], [52, 156, 48, 244], [76, 156, 80, 244]]) { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); }
});

// ── Lay out the line ──
const order = [...MODELS.filter(m => m.world.startsWith('Moon')), ...MODELS.filter(m => m.world.startsWith('Mars'))];
const items = order.map((def, i) => {
  const mars = def.world.startsWith('Mars'), orbit = /orbit/.test(def.world), x = i * GAP + (mars ? WING : 0);
  if (!def.parts.other) def.parts.other = ['Structure', 'The frame, brackets and wiring that hold everything else together.'];
  const wrap = new THREE.Group(); wrap.position.x = x; scene.add(wrap);
  const it = { def, i, x, mars, orbit, wrap, lift: orbit ? 0.75 : 0, h: 1.4, e: 0, eT: 0, lastE: -1, parts: {}, meshes: [], state: 'idle', mPerUnit: 0 };
  if (!orbit) flat(new THREE.CircleGeometry(1.9, 48), new THREE.MeshStandardMaterial({ map: SOIL[mars ? 'Mars' : 'Moon'], roughness: 1, envMapIntensity: 0.25, transparent: true, alphaMap: edge, depthWrite: false }), x, 0.004, 0).receiveShadow = true;
  else flat(new THREE.RingGeometry(1.25, 1.28, 64), new THREE.MeshBasicMaterial({ color: 0x8a6a35 }), x, 0.004, 0); // orbiters hover over a ring, not soil
  flat(new THREE.PlaneGeometry(1.7, 0.6), new THREE.MeshBasicMaterial({ map: label(def.year, 256, 90, '500 64px "DM Mono", ui-monospace, monospace', '#ffb84d'), transparent: true, depthWrite: false }), x, 0.006, 2.35);
  flat(new THREE.PlaneGeometry(0.03, 0.5), new THREE.MeshBasicMaterial({ color: 0xffb84d }), x, 0.006, 1.75);
  it.ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.012, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffb84d, transparent: true, opacity: 0.5 })); it.ring.position.set(x, 0.9, 0); it.ring.visible = false; scene.add(it.ring); // "loading"
  it.child = new THREE.Sprite(new THREE.SpriteMaterial({ map: childTex, transparent: true, depthWrite: false })); it.child.center.set(0.5, 0); it.child.visible = false; wrap.add(it.child);
  return it;
});
const END = items[items.length - 1].x;
flat(new THREE.PlaneGeometry(END + 60, 60), new THREE.MeshBasicMaterial({ color: 0x0b0c0f }), END / 2, 0, 0); // an unlit dark floor…
flat(new THREE.PlaneGeometry(END + 60, 60), new THREE.ShadowMaterial({ opacity: 0.55 }), END / 2, 0.002, 0).receiveShadow = true; // …with the shadows laid over it
flat(new THREE.PlaneGeometry(END + 6, 0.02), new THREE.MeshBasicMaterial({ color: 0x8a6a35 }), END / 2, 0.005, 1.75); // the timeline itself
for (const [text, it] of [['MOON', items[0]], ['MARS', items.find(t => t.mars)]]) flat(new THREE.PlaneGeometry(9, 2.2), new THREE.MeshBasicMaterial({ map: label(text, 1024, 256, '300 210px Newsreader, Georgia, serif', '#3a3b40'), transparent: true, depthWrite: false }), it.x + 2.6, 0.003, -2.9);

const halo = flat(new THREE.RingGeometry(1.98, 2.02, 96), new THREE.MeshBasicMaterial({ color: 0xffb84d, transparent: true, opacity: 0.7 }), 0, 0.007, 0); // marks where you are standing
const UNITS_PER_M = 0.3; // in True size, one metre is this many scene units (the 7 m lunar module stands 2.1 tall)
let trueSize = false, tourT = null;
let cur = 0, mode = 'line', k = 0, camX = 0, camXT = 0;              // k: 0 on the line … 1 inspecting (eased)
let selected = null, hovered = null, quest = null, score = 0, showSize = false;
let dist = 3.7, yaw = 0.6, pitch = 0.16, zf = 1, zb = 0;
const focus = new V3(), focusT = new V3(), AMBER = new THREE.Color(0xffa733), tmp = new V3(), tmp2 = new V3();
const it = () => items[cur];
const eachMat = (m, f) => (Array.isArray(m.material) ? m.material : [m.material]).forEach(f);
const light = (key, lvl) => it().parts[key] && it().parts[key].meshes.forEach(m => eachMat(m, x => { if (x.emissive) { x.emissive.copy(lvl ? AMBER : x.userData.em0); x.emissiveIntensity = lvl || x.userData.ei0; } }));
const say = html => { $('#detail').innerHTML = html; };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
// A part's centre right now, in world space (the machine may be turned on its spot)
